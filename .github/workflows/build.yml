name: pyfastnoiselite

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly run: wheel tests install the newest NumPy/pytest, so this catches
  # dependency drift between releases.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan native wheels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.wheels.outputs.matrix }}
      wheel-plan: ${{ steps.wheels.outputs.wheel-plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - id: wheels
        uses: LedFx/release-ci/actions/plan@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1

  lint:
    name: Lint (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.3"
          extra-args: --all-files
      - name: Shared publication wiring contracts
        run: python3 ci/test_shared_release.py

  build_wheels:
    needs: [plan, lint]
    timeout-minutes: 120
    name: Build wheels on ${{ matrix.runner }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0 # setuptools-scm needs tags for the version

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'armv7l'
        with:
          platforms: arm

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build and test wheels
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: >-
          uv run --frozen --only-group wheel-build python -m cibuildwheel .
          --config-file pyproject.toml --platform "$PLATFORM" --archs "$ARCH"
          --output-dir wheelhouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.runner }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    needs: lint
    timeout-minutes: 30
    name: Build and test source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0 # setuptools-scm needs tags for the version

      # Anyone with write access can push a tag, and a tag can point at a
      # commit that never went through a reviewed PR. Only publish from main.
      - name: Check the release tag and version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(cat version.txt)
          test "$GITHUB_REF_NAME" = "v$version"
          python3 -c 'import json, pathlib; assert json.loads(pathlib.Path(".release-please-manifest.json").read_text())["."] == pathlib.Path("version.txt").read_text().strip()'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # output is published; don't restore a cache

      # `uv build` builds the sdist, then a wheel *from* the sdist, so a file
      # missing from MANIFEST.in fails here instead of on a user's machine.
      - name: Build sdist and a wheel from it
        run: uv build

      - name: Check distribution metadata and README rendering
        run: uvx twine check --strict dist/*

      - name: Test the wheel built from the sdist
        run: |
          uv venv
          uv pip install dist/*.whl --group test
          mkdir sdist
          tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          uv run --no-project pytest sdist/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Keep the NumPy floor in pyproject.toml honest: oldest supported Python
  # with the oldest allowed NumPy.
  numpy_oldest:
    needs: lint
    timeout-minutes: 30
    name: Test oldest supported NumPy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build and install with the oldest NumPy
        run: |
          uv venv
          floor=$(sed -n 's/.*"numpy>=\([0-9.]*\)".*/\1/p' pyproject.toml)
          uv pip install . --group test "numpy==$floor"

      - name: Test
        run: |
          uv run --no-project python -c "import numpy; print('numpy', numpy.__version__)"
          uv run --no-project pytest tests

  ci-passed:
    name: CI passed
    if: always()
    needs: [plan, lint, build_wheels, build_sdist, numpy_oldest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every lint, build and test job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done

  publish-release:
    name: Publish verified package release
    needs: [plan, ci-passed]
    if: github.repository == 'LedFx/pyfastnoiselite-ledfx' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.ci-passed.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/p/pyfastnoiselite-ledfx/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            pyproject.toml
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Mint scoped publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-attestations: write
      - name: Freeze verified distributions and release identity
        id: prepare
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: prepare
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - name: Attest the tested distributions
        id: provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - name: Recheck immutable inputs before PyPI upload
        id: upload
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: check-upload
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - name: Stage verified distributions for PyPI
        if: steps.upload.outputs.pypi_upload == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir pypi-dist
          cp -- dist/* pypi-dist/
      - name: Publish matching missing Python distributions
        if: steps.upload.outputs.pypi_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          skip-existing: true # Both preflights require matching remote SHA-256.
      - name: Verify provenance and finalize existing GitHub draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: finalize
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: release-provenance-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-snapshot.json
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
