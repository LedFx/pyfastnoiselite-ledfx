name: pyfastnoiselite

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly run: wheel tests install the newest NumPy/pytest, so this catches
  # dependency drift between releases.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.3"
          extra-args: --all-files

  build_wheels:
    needs: lint
    timeout-minutes: 120
    name: Build wheels on ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          # Native ARM64 runner, no QEMU
          - os: ubuntu-24.04-arm
            arch: aarch64
          # 32-bit Raspberry Pi OS, emulated
          - os: ubuntu-latest
            arch: armv7l
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0 # setuptools-scm needs tags for the version

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'armv7l'
        with:
          platforms: arm

      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          extras: uv
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    needs: lint
    timeout-minutes: 30
    name: Build and test source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0 # setuptools-scm needs tags for the version

      # Anyone with write access can push a tag, and a tag can point at a
      # commit that never went through a reviewed PR. Only publish from main.
      - name: Check the release tag and version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(cat version.txt)
          test "$GITHUB_REF_NAME" = "v$version"
          python3 -c 'import json, pathlib; assert json.loads(pathlib.Path(".release-please-manifest.json").read_text())["."] == pathlib.Path("version.txt").read_text().strip()'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # output is published; don't restore a cache

      # `uv build` builds the sdist, then a wheel *from* the sdist, so a file
      # missing from MANIFEST.in fails here instead of on a user's machine.
      - name: Build sdist and a wheel from it
        run: uv build

      - name: Test the wheel built from the sdist
        run: |
          uv venv
          uv pip install dist/*.whl --group test
          mkdir sdist
          tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          uv run --no-project pytest sdist/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Keep the NumPy floor in pyproject.toml honest: oldest supported Python
  # with the oldest allowed NumPy.
  numpy_oldest:
    needs: lint
    timeout-minutes: 30
    name: Test oldest supported NumPy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build and install with the oldest NumPy
        run: |
          uv venv
          floor=$(sed -n 's/.*"numpy>=\([0-9.]*\)".*/\1/p' pyproject.toml)
          uv pip install . --group test "numpy==$floor"

      - name: Test
        run: |
          uv run --no-project python -c "import numpy; print('numpy', numpy.__version__)"
          uv run --no-project pytest tests

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, build_wheels, build_sdist, numpy_oldest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every lint, build and test job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done

  publish:
    name: Publish to PyPI
    timeout-minutes: 10
    needs: ci-passed
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyfastnoiselite-ledfx/
    permissions:
      id-token: write # Required for trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R dist

      # Uses trusted publishing and uploads PEP 740 attestations for each file.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Publish the draft only after the tested distributions reach PyPI.
  github-release:
    name: Publish GitHub release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true
      - name: Attach distributions and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --draft=false
          else
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --generate-notes
          fi
